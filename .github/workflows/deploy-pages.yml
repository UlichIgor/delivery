name: Build and deploy Feast Sushi to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Supabase publishable keys are public client credentials, not server secrets.
      # This avoids depending on a stale or incorrectly copied Actions secret.
      - name: Build application
        env:
          CI: "false"
          REACT_APP_SUPABASE_URL: https://hmtqyvyvvcujwsdasvcf.supabase.co
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SVcb3CgpED4Hnyr09ko8QA_Z-Ta1GaE
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
